# Paramètres généraux d'AI Investor.
# Pour personnaliser : copier ce fichier en config/settings.local.yaml (non versionné).

SIMULATION_ONLY: true            # Phase 1 : ne peut pas être désactivé (refusé à la validation).
BASE_CURRENCY: EUR
DEFAULT_INVESTMENT_HORIZON_YEARS: 5
HOST: 127.0.0.1                  # Écoute locale uniquement par défaut.
PORT: 8000
DATABASE_URL: sqlite:///data/ai_investor.db
MAX_DATA_AGE_DAYS: 3             # Au-delà, une donnée de prix est considérée comme périmée.
LLM_PROVIDER: none               # none | ollama | anthropic — désactivé par défaut.

# Portefeuille virtuel. Valeurs d'exemple : à ajuster aux frais réels de votre courtier.
SIMULATION_INITIAL_CAPITAL: 10000
SIMULATION_FEE_FIXED: 1            # frais fixes par opération simulée
SIMULATION_FEE_PERCENT: 0          # frais proportionnels, en % du montant

# Seuils d'analyse (détection, pas de blocage : le blocage relève du Risk Manager).
ABNORMAL_DAILY_MOVE_PERCENT: 8     # variation journalière signalée comme anormale
CORRELATION_ALERT_THRESHOLD: 0.8   # corrélation signalée entre deux positions
CONCENTRATION_HHI_ALERT: 0.25      # indice de Herfindahl (0.25 ≈ 4 positions équivalentes)
MIN_HISTORY_DAYS: 20               # historique minimum pour volatilité / corrélations

# Analyse de marché.
MARKET_BENCHMARK_SYMBOL: null      # indice/ETF de référence (ex. un ETF MSCI World), facultatif
OUTLIER_JUMP_PERCENT: 25           # variation journalière au-delà de laquelle un prix est suspect
MAX_HISTORY_GAP_DAYS: 7            # trou maximal toléré dans un historique (jours calendaires)

# Analyse quantitative (mesures du passé, jamais des prévisions).
RISK_FREE_RATE_PERCENT: 0          # taux sans risque utilisé pour le Sharpe (hypothèse)
MONTE_CARLO_PATHS: 1000            # nombre de scénarios simulés
MONTE_CARLO_SEED: 42               # graine : résultats reproductibles
MONTE_CARLO_HORIZON_DAYS: 252      # horizon des scénarios (jours de bourse)
QUANT_MIN_HISTORY_DAYS: 252        # historique minimum pour un avis quantitatif
QUANT_SHARPE_BUY_THRESHOLD: 0.5    # Sharpe historique à partir duquel le signal est BUY

# Analyse macroéconomique.
MACRO_INFLATION_TARGET_PERCENT: 2  # cible d'inflation de référence (celle de la BCE)
MACRO_STABLE_THRESHOLD: 0.25       # variation (en points) en deçà de laquelle un indicateur est « stable »

# Actualités.
NEWS_LOOKBACK_DAYS: 14             # ancienneté maximale des actualités prises en compte
NEWS_MAX_ITEMS: 50                 # nombre maximal d'actualités analysées par demande

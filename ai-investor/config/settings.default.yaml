# Paramètres généraux d'AI Investor.
# Pour personnaliser : copier ce fichier en config/settings.local.yaml (non versionné).

SIMULATION_ONLY: true            # Phase 1 : ne peut pas être désactivé (refusé à la validation).
BASE_CURRENCY: EUR
DEFAULT_INVESTMENT_HORIZON_YEARS: 5
HOST: 127.0.0.1                  # Écoute locale uniquement par défaut.
PORT: 8000
DATABASE_URL: sqlite:///data/ai_investor.db
MAX_DATA_AGE_DAYS: 3             # Au-delà, une donnée de prix est considérée comme périmée.
LLM_PROVIDER: none               # none | ollama | anthropic — désactivé par défaut.

# Portefeuille virtuel. Valeurs d'exemple : à ajuster aux frais réels de votre courtier.
SIMULATION_INITIAL_CAPITAL: 10000
SIMULATION_FEE_FIXED: 1            # frais fixes par opération simulée
SIMULATION_FEE_PERCENT: 0          # frais proportionnels, en % du montant

# Seuils d'analyse (détection, pas de blocage : le blocage relève du Risk Manager).
ABNORMAL_DAILY_MOVE_PERCENT: 8     # variation journalière signalée comme anormale
CORRELATION_ALERT_THRESHOLD: 0.8   # corrélation signalée entre deux positions
CONCENTRATION_HHI_ALERT: 0.25      # indice de Herfindahl (0.25 ≈ 4 positions équivalentes)
MIN_HISTORY_DAYS: 20               # historique minimum pour volatilité / corrélations
